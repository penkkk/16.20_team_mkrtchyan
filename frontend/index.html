<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/gnf" />
    <script>
      try {
        document.documentElement.classList.toggle('dark', localStorage.getItem('itlib-theme') !== 'light')
      } catch {
        document.documentElement.classList.add('dark')
      }
    </script>
    <title>ITLib</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
