services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: opd_test
      POSTGRES_USER: opd_test
      POSTGRES_PASSWORD: opd_test
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opd_test -d opd_test"]
      interval: 1s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
