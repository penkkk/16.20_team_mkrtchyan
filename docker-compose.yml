services:
  traefik:
    image: traefik:v3.7
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    
  whoami:
    image: traefik/whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.localhost`)"    

  postgres:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opd}
      POSTGRES_USER: ${POSTGRES_USER:-opd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opd}
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opd} -d ${POSTGRES_DB:-opd}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
  migrate:
    image: migrate/migrate:latest
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${POSTGRES_USER:-opd}:${POSTGRES_PASSWORD:-opd}@postgres:5432/${POSTGRES_DB:-opd}?sslmode=disable",
        "up"
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: opd-library:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`) || Path(`/ping`) || PathPrefix(`/swagger`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    env_file:
      - .env
      - ./backend/.env
    environment:
      APP_PORT: ${APP_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-opd}:${POSTGRES_PASSWORD:-opd}@postgres:5432/${POSTGRES_DB:-opd}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: redis://redis:6379/0
      JWT_ISSUER: ${JWT_ISSUER:-opd-library}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-opd-api}
    depends_on:
      postgres:
        condition: service_healthy
      redis: 
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: frontend:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  postgres18_data:
  redis_data:
